<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 AI Glue Agent – Chat</title>
    <style>
        /* Reset and base styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            overflow: hidden;
            padding: 30px 30px 10px 30px;
            transition: all 0.2s;
        }
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid #eef2f6;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            font-size: 32px;
            line-height: 1;
        }
        .header-left h1 {
            font-size: 24px;
            font-weight: 700;
            color: #0b1e33;
            letter-spacing: -0.3px;
        }
        .header-left h1 span {
            color: #2563eb;
            background: #eff6ff;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 500;
            margin-left: 8px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #475569;
            background: #f1f5f9;
            padding: 6px 16px;
            border-radius: 40px;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        /* Iframe wrapper – main chat */
        .iframe-wrapper {
            margin-top: 18px;
            border-radius: 16px;
            overflow: hidden;
            background: #ffffff;
            border: 1px solid #eef2f6;
            height: 75vh;
            min-height: 480px;
            max-height: 800px;
        }
        .iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
        /* Footer */
        .footer {
            text-align: center;
            padding: 18px 0 6px 0;
            font-size: 13px;
            color: #94a3b8;
            border-top: 1px solid #eef2f6;
            margin-top: 16px;
        }
        .footer a {
            color: #2563eb;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        /* Responsive */
        @media (max-width: 640px) {
            .container { padding: 16px; }
            .header-left h1 { font-size: 19px; }
            .header-right { font-size: 12px; padding: 4px 12px; }
            .iframe-wrapper { height: 70vh; min-height: 400px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <span class="logo-icon">🧩</span>
            <h1>AI Glue <span>Chat</span></h1>
        </div>
        <div class="header-right">
            <span class="status-dot"></span> 
            <span>Agent Online</span>
        </div>
    </div>

    <!-- Chat Iframe -->
    <div class="iframe-wrapper">
        <iframe src="https://Pramod123.pythonanywhere.com/chat" 
                title="AI Glue Agent Chat"
                allow="microphone">
        </iframe>
    </div>

    <!-- Footer -->
    <div class="footer">
        🔍 Ask about Salesforce, Jira, Slack, HubSpot & more &nbsp;·&nbsp; 
        <a href="https://gregarious-granita-20d748.netlify.app/">Home</a>
    </div>
</div>

</body>
</html>
